[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whitebox-secure-scan"
version = "0.4.0rc2"
description = "Local static secure-code triage. No AI. No network. No source upload."
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["security", "static-analysis", "secure-coding", "triage"]
authors = [{name = "whitebox-secure-scan contributors"}]
classifiers = ["Development Status :: 4 - Beta", "Programming Language :: Python :: 3", "License :: OSI Approved :: Apache Software License"]
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "jsonschema>=4.0"]

[project.optional-dependencies]
parsing = ["tree-sitter>=0.22", "tree-sitter-languages>=1.10"]
dev = ["pytest>=8", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
whitebox-secure-scan = "whitebox_secure_scan.cli:main"

[project.urls]
Homepage = "https://github.com/example/whitebox-secure-scan"
Repository = "https://github.com/example/whitebox-secure-scan"
Issues = "https://github.com/example/whitebox-secure-scan/issues"
Documentation = "https://github.com/example/whitebox-secure-scan#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "htmlcov", "tests/fixtures"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = false
warn_unused_ignores = true

[tool.setuptools.package-data]
whitebox_secure_scan = ["*.yaml", "*.json"]
